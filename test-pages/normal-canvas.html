<!doctype html><meta charset="utf-8"><title>Normal Canvas Fixture</title><canvas id="c" width="480" height="240"></canvas><button id="save">Save</button><script>const c=document.querySelector("#c"),x=c.getContext("2d");c.addEventListener("pointermove",e=>{if(e.buttons){x.lineTo(e.offsetX,e.offsetY);x.stroke();}});document.querySelector("#save").onclick=()=>c.toBlob(()=>document.body.dataset.saved="true");</script>
